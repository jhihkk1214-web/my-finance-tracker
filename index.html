<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>💳 信用卡記帳管家</title>

  <!-- iOS Safari 桌面 App 專用圖示 (純向量漸層 3D 💳 信用卡圖卡) -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234F46E5'/><rect x='10' y='10' width='80' height='80' rx='18' fill='%233730A3'/><rect x='20' y='30' width='60' height='40' rx='8' fill='%236366F1'/><rect x='25' y='40' width='12' height='10' rx='2' fill='%23F59E0B'/><circle cx='68' cy='58' r='7' fill='%23EF4444' opacity='0.8'/><circle cx='74' cy='58' r='7' fill='%23F59E0B' opacity='0.8'/></svg>" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234F46E5'/><rect x='10' y='10' width='80' height='80' rx='18' fill='%233730A3'/><rect x='20' y='30' width='60' height='40' rx='8' fill='%236366F1'/><rect x='25' y='40' width='12' height='10' rx='2' fill='%23F59E0B'/><circle cx='68' cy='58' r='7' fill='%23EF4444' opacity='0.8'/><circle cx='74' cy='58' r='7' fill='%23F59E0B' opacity='0.8'/></svg>" />

  <!-- Web App 全螢幕模式支援 -->
  <meta name="apple-mobile-web-app-title" content="信用卡記帳" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Safe Area Padding for iPhone Dynamic Island & Home Bar */
    .pt-safe { padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .pb-safe { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 預設 8 大銀行信用卡清單 ---
    const DEFAULT_CARDS = [
      { id: 'c1', name: '富邦銀行', closingDay: 1, dueDay: 19, color: 'from-blue-600 to-indigo-800' },
      { id: 'c2', name: '台新銀行', closingDay: 25, dueDay: 12, color: 'from-rose-600 to-red-800' },
      { id: 'c3', name: '兆豐銀行', closingDay: 15, dueDay: 5, color: 'from-emerald-600 to-teal-800' },
      { id: 'c4', name: '聯邦銀行', closingDay: 20, dueDay: 10, color: 'from-amber-600 to-orange-800' },
      { id: 'c5', name: '永豐銀行', closingDay: 10, dueDay: 28, color: 'from-purple-600 to-indigo-800' },
      { id: 'c6', name: '中國信託', closingDay: 18, dueDay: 8, color: 'from-teal-600 to-cyan-800' },
      { id: 'c7', name: '國泰世華', closingDay: 15, dueDay: 5, color: 'from-emerald-500 to-green-700' },
      { id: 'c8', name: '星展銀行', closingDay: 22, dueDay: 12, color: 'from-red-600 to-rose-900' },
    ];

    const DEFAULT_TRANSACTIONS = [
      { id: 't1', title: '全家超商購物', amount: 245, category: '日常購物', cardId: 'c7', txDate: '2026-11-02', billingCycle: '2026-11', isInstallment: false },
      { id: 't2', title: 'UNIQLO 服飾 (店家延遲請款)', amount: 1990, category: '日常購物', cardId: 'c2', txDate: '2026-10-28', billingCycle: '2026-12', isInstallment: false },
      {
        id: 't_inst_1',
        title: 'iPhone 16 智慧型手機',
        amount: 5000,
        totalAmount: 30000,
        category: '3C 數位',
        cardId: 'c1',
        txDate: '2026-10-15',
        billingCycle: '2026-11',
        isInstallment: true,
        installmentInfo: { currentTerm: 2, totalTerms: 6 }
      }
    ];

    const DEFAULT_FIXED_ITEMS = [
      { id: 'f1', title: '孝親費', amount: 15000, category: '孝親費', type: 'expense', payDay: 5 },
      { id: 'f2', title: '房屋套房租金', amount: 18000, category: '房租房貸', type: 'expense', payDay: 1 },
      { id: 'f3', title: 'ChatGPT Plus (AI訂閱)', amount: 650, category: '信用卡訂閱', type: 'subscription', payDay: 15, cardId: 'c1' },
      { id: 'f4', title: 'Spotify 家族方案', amount: 268, category: '信用卡訂閱', type: 'subscription', payDay: 20, cardId: 'c2' },
      { id: 'f5', title: '健身房每月會費', amount: 1288, category: '信用卡訂閱', type: 'subscription', payDay: 5, cardId: 'c1' },
      { id: 'f6', title: '台積電 (2330) 定期定額', amount: 10000, category: '股票投資', type: 'investment', payDay: 16 }
    ];

    const calculateDefaultBillingCycle = (txDateStr, closingDay = 15) => {
      if (!txDateStr) return '';
      const date = new Date(txDateStr);
      let targetYear = date.getFullYear();
      let targetMonth = date.getMonth();
      if (date.getDate() > closingDay) {
        targetMonth += 1;
        if (targetMonth > 11) {
          targetMonth = 0;
          targetYear += 1;
        }
      }
      return `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}`;
    };

    function App() {
      const [selectedMonth, setSelectedMonth] = useState('2026-11');
      const [activeTab, setActiveTab] = useState('dashboard');

      // 展開明細的卡片 ID 紀錄
      const [expandedCardId, setExpandedCardId] = useState(null);

      // PIN 碼與鎖定狀態
      const [pinCode, setPinCode] = useState(() => localStorage.getItem('cc_tracker_pin') || '');
      const [isLocked, setIsLocked] = useState(() => !!localStorage.getItem('cc_tracker_pin'));
      const [inputPin, setInputPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isSettingPin, setIsSettingPin] = useState(false);
      const [newPin, setNewPin] = useState('');

      // Persistent State
      const [cards, setCards] = useState(() => JSON.parse(localStorage.getItem('cc_cards_v6') || JSON.stringify(DEFAULT_CARDS)));
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('cc_txs_v6') || JSON.stringify(DEFAULT_TRANSACTIONS)));
      const [fixedItems, setFixedItems] = useState(() => JSON.parse(localStorage.getItem('cc_fixed_v6') || JSON.stringify(DEFAULT_FIXED_ITEMS)));
      const [cardPayments, setCardPayments] = useState(() => JSON.parse(localStorage.getItem('cc_card_pay_v6') || '{}'));
      const [fixedPayments, setFixedPayments] = useState(() => JSON.parse(localStorage.getItem('cc_fixed_pay_v6') || '{}'));

      // Save to localStorage
      useEffect(() => { localStorage.setItem('cc_cards_v6', JSON.stringify(cards)); }, [cards]);
      useEffect(() => { localStorage.setItem('cc_txs_v6', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('cc_fixed_v6', JSON.stringify(fixedItems)); }, [fixedItems]);
      useEffect(() => { localStorage.setItem('cc_card_pay_v6', JSON.stringify(cardPayments)); }, [cardPayments]);
      useEffect(() => { localStorage.setItem('cc_fixed_pay_v6', JSON.stringify(fixedPayments)); }, [fixedPayments]);

      // Modals
      const [isAddCardOpen, setIsAddCardOpen] = useState(false);
      const [editingCard, setEditingCard] = useState(null);
      const [newCard, setNewCard] = useState({ name: '', closingDay: 15, dueDay: 5 });

      const [isAddTxOpen, setIsAddTxOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const todayStr = new Date().toISOString().split('T')[0];
      const [newTx, setNewTx] = useState({
        title: '', amount: '', category: '日常購物', cardId: cards[0]?.id || '',
        txDate: todayStr, billingCycle: calculateDefaultBillingCycle(todayStr, 15),
        isInstallment: false, totalTerms: 3, currentTerm: 1
      });

      const [isAddFixedOpen, setIsAddFixedOpen] = useState(false);
      const [editingFixed, setEditingFixed] = useState(null);
      const [newFixed, setNewFixed] = useState({ title: '', amount: '', category: '信用卡訂閱', type: 'subscription', payDay: 5, cardId: cards[0]?.id || '' });

      // Modal Safe Handlers
      const handleOpenAddCard = () => {
        setEditingCard(null);
        setNewCard({ name: '', closingDay: 15, dueDay: 5 });
        setIsAddCardOpen(true);
      };

      const handleOpenEditCard = (c) => {
        if (!c) return;
        setEditingCard(c);
        setNewCard({ name: c.name || '', closingDay: c.closingDay || 15, dueDay: c.dueDay || 5 });
        setIsAddCardOpen(true);
      };

      const handleOpenAddTx = () => {
        setEditingTx(null);
        setNewTx({
          title: '', amount: '', category: '日常購物', cardId: cards[0]?.id || '',
          txDate: todayStr, billingCycle: calculateDefaultBillingCycle(todayStr, 15),
          isInstallment: false, totalTerms: 3, currentTerm: 1
        });
        setIsAddTxOpen(true);
      };

      const handleOpenEditTx = (tx) => {
        if (!tx) return;
        setEditingTx(tx);
        setNewTx({
          title: tx.title || '',
          amount: tx.amount || '',
          category: tx.category || '日常購物',
          cardId: tx.cardId || (cards[0] && cards[0].id) || '',
          txDate: tx.txDate || todayStr,
          billingCycle: tx.billingCycle || calculateDefaultBillingCycle(todayStr, 15),
          isInstallment: !!tx.isInstallment,
          totalTerms: tx.installmentInfo?.totalTerms || 3,
          currentTerm: tx.installmentInfo?.currentTerm || 1
        });
        setIsAddTxOpen(true);
      };

      const handleOpenAddFixed = () => {
        setEditingFixed(null);
        setNewFixed({ title: '', amount: '', category: '信用卡訂閱', type: 'subscription', payDay: 5, cardId: cards[0]?.id || '' });
        setIsAddFixedOpen(true);
      };

      const handleOpenEditFixed = (item) => {
        if (!item) return;
        setEditingFixed(item);
        setNewFixed({
          title: item.title || '',
          amount: item.amount || '',
          category: item.category || '信用卡訂閱',
          type: item.type || 'subscription',
          payDay: item.payDay || 5,
          cardId: item.cardId || (cards[0] && cards[0].id) || ''
        });
        setIsAddFixedOpen(true);
      };

      const handleSaveCard = (e) => {
        e.preventDefault();
        if (!newCard.name) return;
        if (editingCard) {
          setCards(prev => prev.map(c => c.id === editingCard.id ? {
            ...c,
            name: newCard.name,
            closingDay: Number(newCard.closingDay),
            dueDay: Number(newCard.dueDay)
          } : c));
        } else {
          setCards(prev => [{
            id: 'c_' + Date.now(),
            name: newCard.name,
            closingDay: Number(newCard.closingDay),
            dueDay: Number(newCard.dueDay),
            color: 'from-indigo-600 to-blue-700'
          }, ...prev]);
        }
        setIsAddCardOpen(false);
      };

      const handleSaveTx = (e) => {
        e.preventDefault();
        if (!newTx.title || !newTx.amount) return;

        const amountNum = Number(newTx.amount);

        if (editingTx) {
          setTransactions(prev => prev.map(t => t.id === editingTx.id ? {
            ...t,
            title: newTx.title,
            amount: amountNum,
            category: newTx.category,
            cardId: newTx.cardId,
            txDate: newTx.txDate,
            billingCycle: newTx.billingCycle,
            isInstallment: newTx.isInstallment,
            installmentInfo: newTx.isInstallment ? {
              currentTerm: Number(newTx.currentTerm || 1),
              totalTerms: Number(newTx.totalTerms || 3)
            } : undefined
          } : t));
        } else {
          const newId = 't_' + Date.now();
          if (newTx.isInstallment) {
            const totalTerms = Number(newTx.totalTerms || 3);
            const monthlyAmount = Math.round(amountNum / totalTerms);
            setTransactions(prev => [{
              id: newId,
              title: newTx.title,
              amount: monthlyAmount,
              totalAmount: amountNum,
              category: newTx.category,
              cardId: newTx.cardId,
              txDate: newTx.txDate,
              billingCycle: newTx.billingCycle,
              isInstallment: true,
              installmentInfo: { currentTerm: 1, totalTerms }
            }, ...prev]);
          } else {
            setTransactions(prev => [{
              id: newId,
              title: newTx.title,
              amount: amountNum,
              category: newTx.category,
              cardId: newTx.cardId,
              txDate: newTx.txDate,
              billingCycle: newTx.billingCycle,
              isInstallment: false
            }, ...prev]);
          }
        }
        setIsAddTxOpen(false);
      };

      const handleSaveFixed = (e) => {
        e.preventDefault();
        if (!newFixed.title || !newFixed.amount) return;

        const amountNum = Number(newFixed.amount);
        
        // 根據選擇的 type 自動給予適當的分類顯示名稱
        let computedCategory = newFixed.category;
        if (newFixed.type === 'subscription') computedCategory = '信用卡訂閱';
        else if (newFixed.type === 'expense') computedCategory = '固定開銷';
        else if (newFixed.type === 'investment') computedCategory = '股票投資';

        if (editingFixed) {
          setFixedItems(prev => prev.map(f => f.id === editingFixed.id ? {
            ...f,
            title: newFixed.title,
            amount: amountNum,
            category: computedCategory,
            type: newFixed.type,
            payDay: Number(newFixed.payDay),
            cardId: newFixed.type === 'subscription' ? newFixed.cardId : undefined
          } : f));
        } else {
          setFixedItems(prev => [{
            id: 'f_' + Date.now(),
            title: newFixed.title,
            amount: amountNum,
            category: computedCategory,
            type: newFixed.type,
            payDay: Number(newFixed.payDay),
            cardId: newFixed.type === 'subscription' ? newFixed.cardId : undefined
          }, ...prev]);
        }
        setIsAddFixedOpen(false);
      };

      // 依「結帳日」小到大自動排序卡片 (不改變原本儲存資料結構)
      const sortedCards = useMemo(() => {
        return [...cards].sort((a, b) => (Number(a.closingDay) || 0) - (Number(b.closingDay) || 0));
      }, [cards]);

      // 計算當月金額
      const cardTotals = useMemo(() => {
        const map = {};
        cards.forEach(c => { map[c.id] = 0; });

        // 1. 刷卡明細 (包含一般消費與分期付款當期金額)
        transactions.filter(t => t.billingCycle === selectedMonth).forEach(t => {
          if (map[t.cardId] !== undefined) {
            map[t.cardId] += Number(t.amount || 0);
          }
        });

        // 2. 信用卡訂閱連動
        fixedItems.filter(f => f.type === 'subscription' && f.cardId).forEach(f => {
          if (map[f.cardId] !== undefined) {
            map[f.cardId] += Number(f.amount || 0);
          }
        });

        return map;
      }, [cards, transactions, fixedItems, selectedMonth]);

      const totalCreditCardExpense = useMemo(() => {
        return Object.values(cardTotals).reduce((a, b) => a + b, 0);
      }, [cardTotals]);

      const totalFixedExpenses = useMemo(() => {
        return fixedItems.filter(i => i.type === 'expense').reduce((sum, i) => sum + Number(i.amount || 0), 0);
      }, [fixedItems]);

      const totalInvestments = useMemo(() => {
        return fixedItems.filter(i => i.type === 'investment').reduce((sum, i) => sum + Number(i.amount || 0), 0);
      }, [fixedItems]);

      const totalMonthlyOutflow = useMemo(() => {
        return totalCreditCardExpense + totalFixedExpenses + totalInvestments;
      }, [totalCreditCardExpense, totalFixedExpenses, totalInvestments]);

      const toggleCardPayment = (cardId) => {
        const key = `${cardId}_${selectedMonth}`;
        setCardPayments(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const toggleFixedPayment = (itemId) => {
        const key = `${itemId}_${selectedMonth}`;
        setFixedPayments(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const handleExportBackup = () => {
        const data = { cards, transactions, fixedItems, cardPayments, fixedPayments };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `finance_backup_${selectedMonth}.json`;
        a.click();
      };

      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.cards) setCards(data.cards);
            if (data.transactions) setTransactions(data.transactions);
            if (data.fixedItems) setFixedItems(data.fixedItems);
            if (data.cardPayments) setCardPayments(data.cardPayments);
            if (data.fixedPayments) setFixedPayments(data.fixedPayments);
            alert('備份還原成功！');
          } catch (err) {
            alert('無效的備份檔案格式');
          }
        };
        reader.readAsText(file);
      };

      const handleUnlock = (e) => {
        e.preventDefault();
        if (inputPin === pinCode) {
          setIsLocked(false);
          setInputPin('');
          setPinError('');
        } else {
          setPinError('密碼錯誤');
        }
      };

      if (isLocked) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full text-center space-y-6">
              <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">🔒</div>
              <h2 className="text-xl font-bold">私人記帳解鎖</h2>
              <form onSubmit={handleUnlock} className="space-y-4">
                <input
                  type="password"
                  placeholder="輸入 PIN 碼"
                  value={inputPin}
                  onChange={e => setInputPin(e.target.value)}
                  className="w-full text-center text-2xl bg-slate-800 border border-slate-700 rounded-2xl py-3 text-white focus:outline-none"
                  autoFocus
                />
                {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                <button type="submit" className="w-full py-3 bg-indigo-600 text-white rounded-2xl font-bold">解鎖</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col pb-safe pt-safe">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">💳</div>
                <h1 className="text-base font-bold text-white">私人記帳管家</h1>
              </div>

              <div className="flex items-center gap-2">
                <input
                  type="month"
                  value={selectedMonth}
                  onChange={(e) => setSelectedMonth(e.target.value)}
                  className="bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1 text-xs text-slate-200 focus:outline-none"
                />
                
                {/* 優化後的備份與還原按鈕，辨識度更高 */}
                <button 
                  onClick={handleExportBackup} 
                  className="px-2.5 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/40 rounded-xl text-xs font-bold text-indigo-300 flex items-center gap-1 transition" 
                  title="匯出備份 JSON 檔案"
                >
                  <span className="text-sm">📥</span>
                  <span>備份</span>
                </button>
                
                <label 
                  className="px-2.5 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/40 border border-emerald-500/40 rounded-xl text-xs font-bold text-emerald-300 flex items-center gap-1 cursor-pointer transition" 
                  title="選擇並還原 JSON 備份檔"
                >
                  <span className="text-sm">📤</span>
                  <span>還原</span>
                  <input type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                </label>
              </div>
            </div>
          </header>

          {/* Main Navigation Tabs */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-4 space-y-4">
            <div className="flex items-center gap-1.5 overflow-x-auto pb-2 text-xs font-medium border-b border-slate-800">
              {[
                { id: 'dashboard', label: '📊 總覽' },
                { id: 'cards', label: '💳 信用卡帳單' },
                { id: 'transactions', label: '📝 刷卡明細' },
                { id: 'installments', label: '⏳ 分期進度' },
                { id: 'fixed', label: '🏠 固定開銷/訂閱' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3.5 py-2 rounded-xl whitespace-nowrap transition ${
                    activeTab === tab.id ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-800/60 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* Tab 1: Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <span className="text-[11px] text-slate-400 block">當月總流出</span>
                    <span className="text-xl font-black text-white mt-1 block">${totalMonthlyOutflow.toLocaleString()}</span>
                  </div>
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <span className="text-[11px] text-slate-400 block">信用卡當期應繳</span>
                    <span className="text-xl font-black text-indigo-400 mt-1 block">${totalCreditCardExpense.toLocaleString()}</span>
                  </div>
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <span className="text-[11px] text-slate-400 block">固定開銷 / 房租</span>

                  <div>
                    <label className="text-slate-300 block mb-1">項目名稱</label>
                    <input type="text" required value={newFixed.title} onChange={e => setNewFixed({ ...newFixed, title: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" placeholder="如: 房租、孝親費、Spotify" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 block mb-1">金額</label>
                      <input type="number" required value={newFixed.amount} onChange={e => setNewFixed({ ...newFixed, amount: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">扣款日 (1~31日)</label>
                      <input type="number" min={1} max={31} required value={newFixed.payDay} onChange={e => setNewFixed({ ...newFixed, payDay: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-300 block mb-1">類型</label>
                    <select 
                      value={newFixed.type} 
                      onChange={e => {
                        const newType = e.target.value;
                        let defaultCat = '固定開銷';
                        if (newType === 'subscription') defaultCat = '信用卡訂閱';
                        else if (newType === 'investment') defaultCat = '股票投資';
                        setNewFixed({ ...newFixed, type: newType, category: defaultCat });
                      }} 
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-2 py-2 text-white"
                    >
                      <option value="expense">一般固定開銷 (房租/孝親/保險)</option>
                      <option value="subscription">信用卡定期訂閱 (AI/影音/健身房)</option>
                      <option value="investment">股票/ETF投資</option>
                    </select>
                  </div>
                  {newFixed.type === 'subscription' && (
                    <div>
                      <label className="text-indigo-300 block mb-1">綁定扣款信用卡</label>
                      <select value={newFixed.cardId} onChange={e => setNewFixed({ ...newFixed, cardId: e.target.value })} className="w-full bg-slate-900 border border-indigo-700 rounded-xl px-2 py-2 text-white">
                        {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddFixedOpen(false)} className="flex-1 py-2 bg-slate-700 text-white rounded-xl">取消</button>
                    <button type="submit" className="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: 新增/編輯 信用卡 */}
          {isAddCardOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 space-y-4">
                <h3 className="font-bold text-white text-sm">{editingCard ? '編輯信用卡' : '新增信用卡'}</h3>
                <form onSubmit={handleSaveCard} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-300 block mb-1">卡片名稱</label>
                    <input type="text" required value={newCard.name} onChange={e => setNewCard({ ...newCard, name: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-300 block mb-1">結帳日 (1~31日)</label>
                      <input type="number" min={1} max={31} required value={newCard.closingDay} onChange={e => setNewCard({ ...newCard, closingDay: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                    <div>
                      <label className="text-slate-300 block mb-1">繳費日 (1~31日)</label>
                      <input type="number" min={1} max={31} required value={newCard.dueDay} onChange={e => setNewCard({ ...newCard, dueDay: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setIsAddCardOpen(false)} className="flex-1 py-2 bg-slate-700 text-white rounded-xl">取消</button>
                    <button type="submit" className="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">儲存卡片</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
