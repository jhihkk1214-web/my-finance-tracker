<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>每月信用卡與固定開銷管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 預設範例資料 ---
    const DEFAULT_CARDS = [
      { id: 'c1', name: '國泰世華 CUBE 卡', closingDay: 15, dueDay: 5, color: 'from-emerald-500 to-teal-700' },
      { id: 'c2', name: '玉山 Unicard', closingDay: 25, dueDay: 12, color: 'from-blue-500 to-indigo-700' },
      { id: 'c3', name: '富邦 J 卡', closingDay: 1, dueDay: 19, color: 'from-purple-500 to-pink-600' },
    ];

    const DEFAULT_TRANSACTIONS = [
      { id: 't1', title: '全家超商購物', amount: 245, category: '餐飲美饌', cardId: 'c1', txDate: '2026-11-02', billingCycle: '2026-11', isInstallment: false },
      { id: 't2', title: 'UNIQLO 服飾 (店家延遲請款範例)', amount: 1990, category: '日常購物', cardId: 'c2', txDate: '2026-10-28', billingCycle: '2026-12', isInstallment: false },
      { id: 't3', title: '加油站加油', amount: 1200, category: '交通出行', cardId: 'c1', txDate: '2026-11-08', billingCycle: '2026-11', isInstallment: false },
      { id: 't_inst_1_1', groupId: 'inst_iphone', title: 'iPhone 16 智慧型手機 (1/6期)', amount: 5000, totalAmount: 30000, category: '3C 數位', cardId: 'c2', txDate: '2026-10-15', billingCycle: '2026-11', isInstallment: true, installmentInfo: { currentTerm: 1, totalTerms: 6 } },
      { id: 't_inst_1_2', groupId: 'inst_iphone', title: 'iPhone 16 智慧型手機 (2/6期)', amount: 5000, totalAmount: 30000, category: '3C 數位', cardId: 'c2', txDate: '2026-10-15', billingCycle: '2026-12', isInstallment: true, installmentInfo: { currentTerm: 2, totalTerms: 6 } },
      { id: 't_inst_1_3', groupId: 'inst_iphone', title: 'iPhone 16 智慧型手機 (3/6期)', amount: 5000, totalAmount: 30000, category: '3C 數位', cardId: 'c2', txDate: '2026-10-15', billingCycle: '2027-01', isInstallment: true, installmentInfo: { currentTerm: 3, totalTerms: 6 } }
    ];

    const DEFAULT_FIXED_ITEMS = [
      { id: 'f1', title: '孝親費', amount: 15000, category: '孝親費', type: 'expense', payDay: 5 },
      { id: 'f2', title: '房屋套房租金', amount: 18000, category: '房租房貸', type: 'expense', payDay: 1 },
      { id: 'f3', title: '儲蓄型保險', amount: 3500, category: '保險費', type: 'expense', payDay: 20 },
      { id: 'f4', title: '台積電定期定額', amount: 10000, category: '股票投資', type: 'investment', payDay: 16 },
      { id: 'f5', title: '0050 ETF 定期定額', amount: 5000, category: 'ETF投資', type: 'investment', payDay: 6 },
    ];

    const calculateDefaultBillingCycle = (txDateStr, closingDay = 15) => {
      if (!txDateStr) return '';
      const date = new Date(txDateStr);
      let targetYear = date.getFullYear();
      let targetMonth = date.getMonth();
      if (date.getDate() > closingDay) {
        targetMonth += 1;
        if (targetMonth > 11) {
          targetMonth = 0;
          targetYear += 1;
        }
      }
      return `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}`;
    };

    function App() {
      const [selectedMonth, setSelectedMonth] = useState('2026-11');
      const [viewMode, setViewMode] = useState('billing');
      const [activeTab, setActiveTab] = useState('dashboard');

      // 解鎖與 PIN 碼
      const [pinCode, setPinCode] = useState(() => localStorage.getItem('cc_pin_v7') || '');
      const [isLocked, setIsLocked] = useState(() => !!localStorage.getItem('cc_pin_v7'));
      const [inputPin, setInputPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isSettingPin, setIsSettingPin] = useState(false);
      const [newPin, setNewPin] = useState('');
      const [isBackupOpen, setIsBackupOpen] = useState(false);

      // LocalStorage 資料儲存與安全讀取
      const [cards, setCards] = useState(() => {
        try {
          const saved = localStorage.getItem('cc_cards_v7');
          return saved ? JSON.parse(saved) : DEFAULT_CARDS;
        } catch(e) { return DEFAULT_CARDS; }
      });

      const [transactions, setTransactions] = useState(() => {
        try {
          const saved = localStorage.getItem('cc_tx_v7');
          return saved ? JSON.parse(saved) : DEFAULT_TRANSACTIONS;
        } catch(e) { return DEFAULT_TRANSACTIONS; }
      });

      const [fixedItems, setFixedItems] = useState(() => {
        try {
          const saved = localStorage.getItem('cc_fixed_v7');
          return saved ? JSON.parse(saved) : DEFAULT_FIXED_ITEMS;
        } catch(e) { return DEFAULT_FIXED_ITEMS; }
      });

      const [cardPayments, setCardPayments] = useState(() => {
        try {
          const saved = localStorage.getItem('cc_card_pay_v7');
          return saved ? JSON.parse(saved) : { 'c1_2026-11': true };
        } catch(e) { return { 'c1_2026-11': true }; }
      });

      const [fixedPayments, setFixedPayments] = useState(() => {
        try {
          const saved = localStorage.getItem('cc_fixed_pay_v7');
          return saved ? JSON.parse(saved) : { 'f1_2026-11': true, 'f2_2026-11': true };
        } catch(e) { return { 'f1_2026-11': true, 'f2_2026-11': true }; }
      });

      // Modals
      const [isAddCardOpen, setIsAddCardOpen] = useState(false);
      const [isAddTxOpen, setIsAddTxOpen] = useState(false);
      const [isAddFixedOpen, setIsAddFixedOpen] = useState(false);

      const todayStr = new Date().toISOString().split('T')[0];
      const [newCard, setNewCard] = useState({ name: '', closingDay: 15, dueDay: 5, color: 'from-indigo-600 to-blue-700' });
      const [newTx, setNewTx] = useState({ title: '', amount: '', category: '日常購物', cardId: DEFAULT_CARDS[0]?.id || '', txDate: todayStr, billingCycle: calculateDefaultBillingCycle(todayStr, 15), isInstallment: false, totalTerms: 3 });
      const [newFixed, setNewFixed] = useState({ title: '', amount: '', category: '孝親費', type: 'expense', payDay: 5 });

      useEffect(() => { localStorage.setItem('cc_cards_v7', JSON.stringify(cards)); }, [cards]);
      useEffect(() => { localStorage.setItem('cc_tx_v7', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('cc_fixed_v7', JSON.stringify(fixedItems)); }, [fixedItems]);
      useEffect(() => { localStorage.setItem('cc_card_pay_v7', JSON.stringify(cardPayments)); }, [cardPayments]);
      useEffect(() => { localStorage.setItem('cc_fixed_pay_v7', JSON.stringify(fixedPayments)); }, [fixedPayments]);

      // 安全過濾當月交易
      const currentMonthTransactions = useMemo(() => {
        if (!Array.isArray(transactions)) return [];
        return transactions.filter(t => {
          if (!t) return false;
          return viewMode === 'billing' ? t.billingCycle === selectedMonth : (t.txDate && t.txDate.startsWith(selectedMonth));
        });
      }, [transactions, selectedMonth, viewMode]);

      // 分期分組數據
      const installmentGroups = useMemo(() => {
        const map = {};
        if (!Array.isArray(transactions)) return [];
        transactions.forEach(t => {
          if (t && t.isInstallment && t.groupId) {
            if (!map[t.groupId]) {
              map[t.groupId] = {
                groupId: t.groupId,
                title: (t.title || '').replace(/\s\(\d+\/\d+期\)/, ''),
                totalAmount: t.totalAmount || (t.amount * (t.installmentInfo?.totalTerms || 1)),
                cardId: t.cardId,
                category: t.category,
                totalTerms: t.installmentInfo?.totalTerms || 1,
                terms: []
              };
            }
            map[t.groupId].terms.push(t);
          }
        });
        return Object.values(map);
      }, [transactions]);

      // 卡片金額統計
      const cardTotals = useMemo(() => {
        const map = {};
        if (Array.isArray(cards)) {
          cards.forEach(c => { if(c && c.id) map[c.id] = 0; });
        }
        currentMonthTransactions.forEach(t => { 
          if (t && map[t.cardId] !== undefined) map[t.cardId] += Number(t.amount || 0); 
        });
        return map;
      }, [cards, currentMonthTransactions]);

      const totalCreditCardExpense = useMemo(() => Object.values(cardTotals).reduce((a, b) => a + b, 0), [cardTotals]);
      const totalFixedExpenses = useMemo(() => {
        if (!Array.isArray(fixedItems)) return 0;
        return fixedItems.filter(i => i && i.type === 'expense').reduce((sum, i) => sum + Number(i.amount || 0), 0);
      }, [fixedItems]);

      const totalInvestments = useMemo(() => {
        if (!Array.isArray(fixedItems)) return 0;
        return fixedItems.filter(i => i && i.type === 'investment').reduce((sum, i) => sum + Number(i.amount || 0), 0);
      }, [fixedItems]);

      const totalOutflow = totalCreditCardExpense + totalFixedExpenses + totalInvestments;

      // 切換信用卡繳款狀態 (確保 safe state)
      const toggleCardPayment = (cardId) => {
        const key = `${cardId}_${selectedMonth}`;
        setCardPayments(prev => {
          const nextState = { ...prev };
          if (nextState[key]) {
            delete nextState[key];
          } else {
            nextState[key] = true;
          }
          return nextState;
        });
      };

      // 切換固定開銷扣款狀態 (確保 safe state)
      const toggleFixedPayment = (itemId) => {
        const key = `${itemId}_${selectedMonth}`;
        setFixedPayments(prev => {
          const nextState = { ...prev };
          if (nextState[key]) {
            delete nextState[key];
          } else {
            nextState[key] = true;
          }
          return nextState;
        });
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!newTx.title || !newTx.amount) return;
        const totalAmt = Number(newTx.amount);

        if (newTx.isInstallment && newTx.totalTerms > 1) {
          const termsCount = Number(newTx.totalTerms);
          const monthlyAmt = Math.round(totalAmt / termsCount);
          const groupId = 'inst_' + Date.now();
          const newItems = [];
          const [startYear, startMonth] = (newTx.billingCycle || '2026-11').split('-').map(Number);

          for (let i = 0; i < termsCount; i++) {
            let curMonth = startMonth + i;
            let curYear = startYear;
            while (curMonth > 12) { curMonth -= 12; curYear += 1; }
            newItems.push({
              id: `t_${groupId}_${i + 1}`,
              groupId,
              title: `${newTx.title} (${i + 1}/${termsCount}期)`,
              amount: monthlyAmt,
              totalAmount: totalAmt,
              category: newTx.category,
              cardId: newTx.cardId || (cards[0] ? cards[0].id : ''),
              txDate: newTx.txDate,
              billingCycle: `${curYear}-${String(curMonth).padStart(2, '0')}`,
              isInstallment: true,
              installmentInfo: { currentTerm: i + 1, totalTerms: termsCount }
            });
          }
          setTransactions([...newItems, ...transactions]);
        } else {
          setTransactions([{
            id: 't_' + Date.now(),
            ...newTx,
            amount: totalAmt
          }, ...transactions]);
        }
        setIsAddTxOpen(false);
      };

      const handleAddCard = (e) => {
        e.preventDefault();
        if (!newCard.name) return;
        setCards([...cards, {
          ...newCard,
          id: 'c_' + Date.now(),
          closingDay: Number(newCard.closingDay),
          dueDay: Number(newCard.dueDay)
        }]);
        setIsAddCardOpen(false);
      };

      const handleAddFixed = (e) => {
        e.preventDefault();
        if (!newFixed.title || !newFixed.amount) return;
        setFixedItems([...fixedItems, {
          ...newFixed,
          id: 'f_' + Date.now(),
          amount: Number(newFixed.amount),
          payDay: Number(newFixed.payDay)
        }]);
        setIsAddFixedOpen(false);
      };

      if (isLocked) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full text-center space-y-6 shadow-2xl">
              <div className="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg text-white font-bold text-2xl">
                🔒
              </div>
              <h2 className="text-xl font-bold text-white">私人記帳解鎖</h2>
              <form onSubmit={(e) => {
                e.preventDefault();
                if (inputPin === pinCode) setIsLocked(false);
                else setPinError('密碼錯誤');
              }} className="space-y-4">
                <input 
                  type="password"
                  placeholder="輸入 PIN 碼"
                  value={inputPin}
                  onChange={e => setInputPin(e.target.value)}
                  className="w-full text-center text-2xl bg-slate-800 border border-slate-700 rounded-2xl py-3 text-white focus:outline-none focus:border-indigo-500"
                  autoFocus
                />
                {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-sm">解鎖</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans pb-10">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center justify-between w-full sm:w-auto gap-3">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-lg">💳</div>
                  <div>
                    <h1 className="text-base font-bold text-white">每月開銷與信用卡管家</h1>
                    <p className="text-[10px] text-slate-400">專為 iPhone 打造的私人記帳</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => setIsBackupOpen(true)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg text-cyan-400 text-xs font-bold">
                    📁 備份
                  </button>
                  <button onClick={() => setIsSettingPin(true)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg text-indigo-400 text-xs font-bold">
                    🔑 密碼
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between w-full sm:w-auto gap-2">
                <div className="bg-slate-800 border border-slate-700 p-1 rounded-lg flex text-xs">
                  <button onClick={() => setViewMode('billing')} className={`px-2.5 py-1 rounded-md transition ${viewMode === 'billing' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}>帳單月</button>
                  <button onClick={() => setViewMode('transaction')} className={`px-2.5 py-1 rounded-md transition ${viewMode === 'transaction' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'}`}>消費月</button>
                </div>

                <input 
                  type="month" 
                  value={selectedMonth} 
                  onChange={(e) => setSelectedMonth(e.target.value)}
                  className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white"
                />
              </div>
            </div>
          </header>

          {/* 主要區塊 */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-4 space-y-5">
            {/* Nav Tabs */}
            <div className="flex items-center justify-between border-b border-slate-800 pb-2 overflow-x-auto gap-2">
              <div className="flex gap-1.5">
                {[
                  { id: 'dashboard', label: '📊 總覽' },
                  { id: 'cards', label: '💳 卡片帳單' },
                  { id: 'transactions', label: '📝 消費明細' },
                  { id: 'installments', label: '📚 分期付款' },
                  { id: 'fixed', label: '🏠 固定開銷' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                      activeTab === tab.id ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <button onClick={() => setIsAddTxOpen(true)} className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">+ 記刷卡</button>
            </div>

            {/* Tab 1: Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-5">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <div className="text-[11px] text-slate-400">當月總流出</div>
                    <div className="text-xl font-black text-white mt-0.5">${totalOutflow.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <div className="text-[11px] text-slate-400">信用卡應繳</div>
                    <div className="text-xl font-black text-emerald-400 mt-0.5">${totalCreditCardExpense.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <div className="text-[11px] text-slate-400">固定開銷 / 孝親</div>
                    <div className="text-xl font-black text-rose-400 mt-0.5">${totalFixedExpenses.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5">
                    <div className="text-[11px] text-slate-400">定期定額投資</div>
                    <div className="text-xl font-black text-cyan-400 mt-0.5">${totalInvestments.toLocaleString()}</div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {/* 信用卡待繳情況 */}
                  <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 space-y-3">
                    <h3 className="font-bold text-white text-xs flex items-center gap-1">
                      💳 信用卡當期繳費狀態 ({selectedMonth})
                    </h3>
                    {cards.map(card => {
                      const amount = cardTotals[card.id] || 0;
                      const isPaid = !!cardPayments[`${card.id}_${selectedMonth}`];
                      return (
                        <div key={card.id} className="p-3 bg-slate-800/90 rounded-xl flex justify-between items-center text-xs">
                          <div className="flex items-center gap-2.5">
                            <button 
                              type="button"
                              onClick={() => toggleCardPayment(card.id)} 
                              className={`w-6 h-6 rounded-lg flex items-center justify-center border font-bold text-xs transition ${isPaid ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600 text-slate-400'}`}
                            >
                              {isPaid ? '✓' : ''}
                            </button>
                            <span className="font-medium text-slate-200">{card.name}</span>
                          </div>
                          <div className="text-right">
                            <span className="font-bold text-slate-100">${amount.toLocaleString()}</span>
                            <span className={`ml-2 text-[10px] font-bold ${isPaid ? 'text-emerald-400' : 'text-amber-400'}`}>
                              {isPaid ? '已繳' : '未繳'}
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* 固定開銷待處理 */}
                  <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 space-y-3">
                    <h3 className="font-bold text-white text-xs flex items-center gap-1">
                      🏠 固定開銷與投資 ({selectedMonth})
                    </h3>
                    {fixedItems.map(item => {
                      const isPaid = !!fixedPayments[`${item.id}_${selectedMonth}`];
                      return (
                        <div key={item.id} className="p-3 bg-slate-800/90 rounded-xl flex justify-between items-center text-xs">
                          <div className="flex items-center gap-2.5">
                            <button 
                              type="button"
                              onClick={() => toggleFixedPayment(item.id)} 
                              className={`w-6 h-6 rounded-lg flex items-center justify-center border font-bold text-xs transition ${isPaid ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600 text-slate-400'}`}
                            >
                              {isPaid ? '✓' : ''}
                            </button>
                            <span className="font-medium text-slate-200">{item.title}</span>
                          </div>
                          <div className="text-right">
                            <span className="font-bold text-slate-100">${item.amount.toLocaleString()}</span>
                            <span className={`ml-2 text-[10px] font-bold ${isPaid ? 'text-emerald-400' : 'text-amber-400'}`}>
                              {isPaid ? '已處理' : '未處理'}
                            </span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* Tab 2: Cards */}
            {activeTab === 'cards' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-white">卡片列表 ({cards.length})</h2>
                  <button onClick={() => setIsAddCardOpen(true)} className="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs">+ 新增卡片</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {cards.map(card => {
                    const amount = cardTotals[card.id] || 0;
                    const isPaid = !!cardPayments[`${card.id}_${selectedMonth}`];
                    return (
                      <div key={card.id} className={`p-5 rounded-2xl bg-gradient-to-br ${card.color} text-white space-y-3 shadow-lg`}>
                        <div className="flex justify-between items-start">
                          <h3 className="text-base font-bold">{card.name}</h3>
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${isPaid ? 'bg-white/20' : 'bg-amber-400 text-slate-900'}`}>{isPaid ? '已繳清' : '待繳費'}</span>
                        </div>
                        <div>
                          <div className="text-[10px] opacity-80">當期帳單</div>
                          <div className="text-2xl font-black">${amount.toLocaleString()}</div>
                        </div>
                        <div className="text-[10px] opacity-80 flex justify-between border-t border-white/10 pt-2">
                          <span>{card.closingDay}日 結帳</span>
                          <span>{card.dueDay}日 繳款</span>
                        </div>
                        <button 
                          type="button"
                          onClick={() => toggleCardPayment(card.id)} 
                          className="w-full py-2 bg-black/20 hover:bg-black/30 text-xs rounded-xl font-bold transition"
                        >
                          {isPaid ? '標示為未繳費' : '標示為已繳費'}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Tab 3: Transactions */}
            {activeTab === 'transactions' && (
              <div className="bg-slate-800/40 border border-slate-800 rounded-2xl overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-200">
                    <thead className="bg-slate-800 text-slate-400 border-b border-slate-700">
                      <tr>
                        <th className="p-3 whitespace-nowrap">消費日</th>
                        <th className="p-3 whitespace-nowrap">歸屬帳單</th>
                        <th className="p-3 whitespace-nowrap">項目</th>
                        <th className="p-3 whitespace-nowrap">卡片</th>
                        <th className="p-3 text-right whitespace-nowrap">金額</th>
                        <th className="p-3 text-center whitespace-nowrap">刪除</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {currentMonthTransactions.length === 0 ? (
                        <tr><td colSpan={6} className="text-center py-6 text-slate-500">本月無消費紀錄</td></tr>
                      ) : (
                        currentMonthTransactions.map(t => (
                          <tr key={t.id} className="hover:bg-slate-800/50">
                            <td className="p-3 font-mono text-[11px] text-slate-400">{t.txDate}</td>
                            <td className="p-3 font-mono text-indigo-300">
                              <input 
                                type="month" 
                                value={t.billingCycle} 
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setTransactions(transactions.map(item => item.id === t.id ? { ...item, billingCycle: val } : item));
                                }}
                                className="bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-indigo-300"
                              />
                            </td>
                            <td className="p-3 font-medium">{t.title}</td>
                            <td className="p-3">{cards.find(c => c.id === t.cardId)?.name || '未知卡片'}</td>
                            <td className="p-3 text-right font-bold">${t.amount.toLocaleString()}</td>
                            <td className="p-3 text-center">
                              <button onClick={() => setTransactions(transactions.filter(item => item.id !== t.id))} className="text-rose-400 p-1">刪除</button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Tab 4: Installments */}
            {activeTab === 'installments' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {installmentGroups.length === 0 ? (
                  <div className="col-span-full text-center py-8 text-slate-500 text-xs">目前沒有任何分期付款項目</div>
                ) : (
                  installmentGroups.map(group => {
                    const paidTermsCount = group.terms.filter(t => t.billingCycle <= selectedMonth).length;
                    const progressPct = Math.min(100, Math.round((paidTermsCount / group.totalTerms) * 100));

                    return (
                      <div key={group.groupId} className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 space-y-3">
                        <div className="flex justify-between items-start">
                          <h3 className="text-sm font-bold text-white">{group.title}</h3>
                          <button onClick={() => setTransactions(transactions.filter(t => t.groupId !== group.groupId))} className="text-xs text-rose-400">刪除分期</button>
                        </div>

                        <div className="space-y-1">
                          <div className="flex justify-between text-xs text-slate-300">
                            <span>進度: {paidTermsCount} / {group.totalTerms} 期</span>
                            <span className="font-bold">{progressPct}%</span>
                          </div>
                          <div className="w-full bg-slate-700 rounded-full h-1.5 overflow-hidden">
                            <div className="bg-gradient-to-r from-purple-500 to-indigo-500 h-1.5 rounded-full" style={{ width: `${progressPct}%` }}></div>
                          </div>
                        </div>

                        <div className="text-xs space-y-1 pt-2 border-t border-slate-700/60 max-h-28 overflow-y-auto">
                          {group.terms.map(term => (
                            <div key={term.id} className="flex justify-between text-[11px] text-slate-300">
                              <span>{term.billingCycle} (第 {term.installmentInfo?.currentTerm} 期)</span>
                              <span className="font-bold">${term.amount.toLocaleString()}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* Tab 5: Fixed Expenses */}
            {activeTab === 'fixed' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-white">固定開銷 ({fixedItems.length})</h2>
                  <button onClick={() => setIsAddFixedOpen(true)} className="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs">+ 新增開銷</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {fixedItems.map(item => (
                    <div key={item.id} className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 space-y-2">
                      <div className="flex justify-between items-start">
                        <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">{item.category}</span>
                        <button onClick={() => setFixedItems(fixedItems.filter(f => f.id !== item.id))} className="text-rose-400 text-xs">刪除</button>
                      </div>
                      <h3 className="text-sm font-bold text-white">{item.title}</h3>
                      <div className="text-xl font-black text-white">${item.amount.toLocaleString()}</div>
                      <div className="text-[11px] text-slate-400">每月 {item.payDay} 日處理</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Modal: 新增卡片 */}
          {isAddCardOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-5 space-y-4">
                <h3 className="text-base font-bold text-white">新增信用卡</h3>
                <form onSubmit={handleAddCard} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">卡片名稱</label>
                    <input type="text" required placeholder="例如：台新 FlyGo" value={newCard.name} onChange={e => setNewCard({...newCard, name: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">每月結帳日</label>
                      <input type="number" min="1" max="31" value={newCard.closingDay} onChange={e => setNewCard({...newCard, closingDay: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">每月繳費日</label>
                      <input type="number" min="1" max="31" value={newCard.dueDay} onChange={e => setNewCard({...newCard, dueDay: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">儲存</button>
                    <button type="button" onClick={() => setIsAddCardOpen(false)} className="px-4 py-2.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: 新增刷卡 */}
          {isAddTxOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4">
                <h3 className="text-base font-bold text-white">記一筆刷卡消費</h3>
                <form onSubmit={handleAddTransaction} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">消費項目</label>
                    <input type="text" required placeholder="如：全家超商" value={newTx.title} onChange={e => setNewTx({ ...newTx, title: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">金額</label>
                      <input type="number" required placeholder="0" value={newTx.amount} onChange={e => setNewTx({ ...newTx, amount: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">信用卡</label>
                      <select value={newTx.cardId} onChange={e => setNewTx({ ...newTx, cardId: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                        {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="p-3 bg-slate-900 rounded-xl space-y-2 border border-slate-700/60">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={newTx.isInstallment} onChange={e => setNewTx({ ...newTx, isInstallment: e.target.checked })} />
                      <span>開啟信用卡分期付款</span>
                    </label>
                    {newTx.isInstallment && (
                      <select value={newTx.totalTerms} onChange={e => setNewTx({ ...newTx, totalTerms: Number(e.target.value) })} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-white">
                        {[3, 6, 12, 18, 24].map(n => <option key={n} value={n}>分 {n} 期</option>)}
                      </select>
                    )}
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">儲存明細</button>
                    <button type="button" onClick={() => setIsAddTxOpen(false)} className="px-4 py-2.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: 新增固定開銷 */}
          {isAddFixedOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-5 space-y-4">
                <h3 className="text-base font-bold text-white">新增固定開銷 / 股票投資</h3>
                <form onSubmit={handleAddFixed} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">項目名稱</label>
                    <input type="text" required placeholder="如：孝親費、房租、0050定期定額" value={newFixed.title} onChange={e => setNewFixed({ ...newFixed, title: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">金額</label>
                      <input type="number" required placeholder="0" value={newFixed.amount} onChange={e => setNewFixed({ ...newFixed, amount: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">每月處理日 (1-31)</label>
                      <input type="number" min="1" max="31" value={newFixed.payDay} onChange={e => setNewFixed({ ...newFixed, payDay: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1">類型</label>
                    <select value={newFixed.type} onChange={e => setNewFixed({ ...newFixed, type: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
                      <option value="expense">固定開銷 (房租/孝親)</option>
                      <option value="investment">股票/ETF 定期定額</option>
                    </select>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">儲存</button>
                    <button type="button" onClick={() => setIsAddFixedOpen(false)} className="px-4 py-2.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Backup Modal */}
          {isBackupOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4">
                <h3 className="text-base font-bold text-white">iPhone 備份與還原</h3>
                <p className="text-xs text-slate-400">建議定期導出備份檔至 iPhone「檔案」App 防快取清除。</p>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      const data = { cards, transactions, fixedItems, cardPayments, fixedPayments };
                      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                      const a = document.createElement('a');
                      a.href = URL.createObjectURL(blob);
                      a.download = `finance_backup_${new Date().toISOString().split('T')[0]}.json`;
                      a.click();
                    }}
                    className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-semibold"
                  >
                    匯出備份檔
                  </button>
                  <label className="flex-1 py-2.5 bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold text-center cursor-pointer">
                    還原備份檔
                    <input 
                      type="file" 
                      accept=".json"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (event) => {
                          try {
                            const data = JSON.parse(event.target.result);
                            if (data.cards) setCards(data.cards);
                            if (data.transactions) setTransactions(data.transactions);
                            if (data.fixedItems) setFixedItems(data.fixedItems);
                            if (data.cardPayments) setCardPayments(data.cardPayments);
                            if (data.fixedPayments) setFixedPayments(data.fixedPayments);
                            alert('備份已成功還原！');
                            setIsBackupOpen(false);
                          } catch (err) { alert('格式錯誤'); }
                        };
                        reader.readAsText(file);
                      }}
                    />
                  </label>
                </div>
                <button onClick={() => setIsBackupOpen(false)} className="w-full py-2 bg-slate-900 text-slate-400 rounded-xl text-xs">關閉</button>
              </div>
            </div>
          )}

          {/* Modal: 設定 PIN 碼 */}
          {isSettingPin && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-xs w-full p-5 space-y-4">
                <h3 className="text-base font-bold text-white">設定解鎖 PIN 碼</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (newPin.length < 4) return alert('請設定至少 4 位數');
                  localStorage.setItem('cc_pin_v7', newPin);
                  setPinCode(newPin);
                  setIsSettingPin(false);
                  setNewPin('');
                  alert('密碼設定成功！');
                }} className="space-y-3 text-xs">
                  <input type="password" required placeholder="輸入 4 位數密碼" value={newPin} onChange={e => setNewPin(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-center text-lg text-white" />
                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">啟用密碼</button>
                    {pinCode && (
                      <button type="button" onClick={() => { localStorage.removeItem('cc_pin_v7'); setPinCode(''); setIsSettingPin(false); }} className="py-2 px-3 bg-rose-500/20 text-rose-300 rounded-xl">清除</button>
                    )}
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
