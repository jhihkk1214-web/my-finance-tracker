<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月信用卡與固定開銷管理系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Lucide 圖示動態渲染 ---
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className} {...props}></i>;
    };

    // --- 預設範例資料 ---
    const DEFAULT_CARDS = [
      { id: 'c1', name: '國泰世華 CUBE 卡', closingDay: 15, dueDay: 5, color: 'from-emerald-500 to-teal-700' },
      { id: 'c2', name: '玉山 Unicard', closingDay: 25, dueDay: 12, color: 'from-blue-500 to-indigo-700' },
      { id: 'c3', name: '富邦 J 卡', closingDay: 1, dueDay: 19, color: 'from-purple-500 to-pink-600' },
    ];

    const DEFAULT_TRANSACTIONS = [
      { id: 't1', title: '全家超商購物', amount: 245, category: '餐飲美饌', cardId: 'c1', txDate: '2026-11-02', billingCycle: '2026-11', isInstallment: false },
      { id: 't2', title: 'UNIQLO 服飾 (店家延遲請款範例)', amount: 1990, category: '日常購物', cardId: 'c2', txDate: '2026-10-28', billingCycle: '2026-12', isInstallment: false },
      { id: 't3', title: '加油站加油', amount: 1200, category: '交通出行', cardId: 'c1', txDate: '2026-11-08', billingCycle: '2026-11', isInstallment: false },
      { id: 't_inst_1_1', groupId: 'inst_iphone', title: 'iPhone 16 智慧型手機 (1/6期)', amount: 5000, totalAmount: 30000, category: '3C 數位', cardId: 'c2', txDate: '2026-10-15', billingCycle: '2026-11', isInstallment: true, installmentInfo: { currentTerm: 1, totalTerms: 6 } },
      { id: 't_inst_1_2', groupId: 'inst_iphone', title: 'iPhone 16 智慧型手機 (2/6期)', amount: 5000, totalAmount: 30000, category: '3C 數位', cardId: 'c2', txDate: '2026-10-15', billingCycle: '2026-12', isInstallment: true, installmentInfo: { currentTerm: 2, totalTerms: 6 } },
      { id: 't_inst_1_3', groupId: 'inst_iphone', title: 'iPhone 16 智慧型手機 (3/6期)', amount: 5000, totalAmount: 30000, category: '3C 數位', cardId: 'c2', txDate: '2026-10-15', billingCycle: '2027-01', isInstallment: true, installmentInfo: { currentTerm: 3, totalTerms: 6 } }
    ];

    const DEFAULT_FIXED_ITEMS = [
      { id: 'f1', title: '孝親費', amount: 15000, category: '孝親費', type: 'expense', payDay: 5 },
      { id: 'f2', title: '房屋套房租金', amount: 18000, category: '房租房貸', type: 'expense', payDay: 1 },
      { id: 'f3', title: '儲蓄型保險', amount: 3500, category: '保險費', type: 'expense', payDay: 20 },
      { id: 'f4', title: '台積電定期定額', amount: 10000, category: '股票投資', type: 'investment', payDay: 16 },
      { id: 'f5', title: '0050 ETF 定期定額', amount: 5000, category: 'ETF投資', type: 'investment', payDay: 6 },
    ];

    const calculateDefaultBillingCycle = (txDateStr, closingDay = 15) => {
      if (!txDateStr) return '';
      const date = new Date(txDateStr);
      let targetYear = date.getFullYear();
      let targetMonth = date.getMonth();
      if (date.getDate() > closingDay) {
        targetMonth += 1;
        if (targetMonth > 11) {
          targetMonth = 0;
          targetYear += 1;
        }
      }
      return `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}`;
    };

    function App() {
      const [selectedMonth, setSelectedMonth] = useState('2026-11');
      const [viewMode, setViewMode] = useState('billing');
      const [activeTab, setActiveTab] = useState('dashboard');

      // 密碼與解鎖
      const [pinCode, setPinCode] = useState(() => localStorage.getItem('cc_tracker_pin') || '');
      const [isLocked, setIsLocked] = useState(() => !!localStorage.getItem('cc_tracker_pin'));
      const [inputPin, setInputPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isSettingPin, setIsSettingPin] = useState(false);
      const [newPin, setNewPin] = useState('');
      const [isBackupOpen, setIsBackupOpen] = useState(false);

      // LocalStorage 資料儲存
      const [cards, setCards] = useState(() => JSON.parse(localStorage.getItem('cc_cards_v4')) || DEFAULT_CARDS);
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('cc_tx_v4')) || DEFAULT_TRANSACTIONS);
      const [fixedItems, setFixedItems] = useState(() => JSON.parse(localStorage.getItem('cc_fixed_v4')) || DEFAULT_FIXED_ITEMS);
      const [cardPayments, setCardPayments] = useState(() => JSON.parse(localStorage.getItem('cc_card_pay_v4')) || { 'c1_2026-11': true });
      const [fixedPayments, setFixedPayments] = useState(() => JSON.parse(localStorage.getItem('cc_fixed_pay_v4')) || { 'f1_2026-11': true, 'f2_2026-11': true });

      // Modals
      const [isAddCardOpen, setIsAddCardOpen] = useState(false);
      const [isAddTxOpen, setIsAddTxOpen] = useState(false);
      const [isAddFixedOpen, setIsAddFixedOpen] = useState(false);

      const todayStr = new Date().toISOString().split('T')[0];
      const [newCard, setNewCard] = useState({ name: '', closingDay: 15, dueDay: 5, color: 'from-indigo-600 to-blue-700' });
      const [newTx, setNewTx] = useState({ title: '', amount: '', category: '日常購物', cardId: cards[0]?.id || '', txDate: todayStr, billingCycle: calculateDefaultBillingCycle(todayStr, 15), isInstallment: false, totalTerms: 3 });
      const [newFixed, setNewFixed] = useState({ title: '', amount: '', category: '孝親費', type: 'expense', payDay: 5 });

      useEffect(() => { localStorage.setItem('cc_cards_v4', JSON.stringify(cards)); }, [cards]);
      useEffect(() => { localStorage.setItem('cc_tx_v4', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('cc_fixed_v4', JSON.stringify(fixedItems)); }, [fixedItems]);
      useEffect(() => { localStorage.setItem('cc_card_pay_v4', JSON.stringify(cardPayments)); }, [cardPayments]);
      useEffect(() => { localStorage.setItem('cc_fixed_pay_v4', JSON.stringify(fixedPayments)); }, [fixedPayments]);

      // 計算與統計
      const currentMonthTransactions = useMemo(() => {
        return transactions.filter(t => viewMode === 'billing' ? t.billingCycle === selectedMonth : t.txDate.startsWith(selectedMonth));
      }, [transactions, selectedMonth, viewMode]);

      const installmentGroups = useMemo(() => {
        const map = {};
        transactions.forEach(t => {
          if (t.isInstallment && t.groupId) {
            if (!map[t.groupId]) {
              map[t.groupId] = {
                groupId: t.groupId,
                title: t.title.replace(/\s\(\d+\/\d+期\)/, ''),
                totalAmount: t.totalAmount || (t.amount * (t.installmentInfo?.totalTerms || 1)),
                cardId: t.cardId,
                category: t.category,
                totalTerms: t.installmentInfo?.totalTerms || 1,
                terms: []
              };
            }
            map[t.groupId].terms.push(t);
          }
        });
        return Object.values(map);
      }, [transactions]);

      const cardTotals = useMemo(() => {
        const map = {};
        cards.forEach(c => { map[c.id] = 0; });
        currentMonthTransactions.forEach(t => { if (map[t.cardId] !== undefined) map[t.cardId] += Number(t.amount); });
        return map;
      }, [cards, currentMonthTransactions]);

      const totalCreditCardExpense = useMemo(() => Object.values(cardTotals).reduce((a, b) => a + b, 0), [cardTotals]);
      const totalFixedExpenses = useMemo(() => fixedItems.filter(i => i.type === 'expense').reduce((sum, i) => sum + Number(i.amount), 0), [fixedItems]);
      const totalInvestments = useMemo(() => fixedItems.filter(i => i.type === 'investment').reduce((sum, i) => sum + Number(i.amount), 0), [fixedItems]);
      const totalOutflow = totalCreditCardExpense + totalFixedExpenses + totalInvestments;

      const toggleCardPayment = (cardId) => {
        const key = `${cardId}_${selectedMonth}`;
        setCardPayments(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const toggleFixedPayment = (itemId) => {
        const key = `${itemId}_${selectedMonth}`;
        setFixedPayments(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const handleAddTransaction = (e) => {
        e.preventDefault();
        if (!newTx.title || !newTx.amount) return;
        const totalAmt = Number(newTx.amount);

        if (newTx.isInstallment && newTx.totalTerms > 1) {
          const termsCount = Number(newTx.totalTerms);
          const monthlyAmt = Math.round(totalAmt / termsCount);
          const groupId = 'inst_' + Date.now();
          const newItems = [];
          const [startYear, startMonth] = newTx.billingCycle.split('-').map(Number);

          for (let i = 0; i < termsCount; i++) {
            let curMonth = startMonth + i;
            let curYear = startYear;
            while (curMonth > 12) { curMonth -= 12; curYear += 1; }
            newItems.push({
              id: `t_${groupId}_${i + 1}`,
              groupId,
              title: `${newTx.title} (${i + 1}/${termsCount}期)`,
              amount: monthlyAmt,
              totalAmount: totalAmt,
              category: newTx.category,
              cardId: newTx.cardId,
              txDate: newTx.txDate,
              billingCycle: `${curYear}-${String(curMonth).padStart(2, '0')}`,
              isInstallment: true,
              installmentInfo: { currentTerm: i + 1, totalTerms: termsCount }
            });
          }
          setTransactions([...newItems, ...transactions]);
        } else {
          setTransactions([{
            id: 't_' + Date.now(),
            ...newTx,
            amount: totalAmt
          }, ...transactions]);
        }
        setIsAddTxOpen(false);
      };

      if (isLocked) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full text-center space-y-6 shadow-2xl">
              <div className="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-2xl flex items-center justify-center mx-auto shadow-lg">
                <Icon name="shield-check" className="w-8 h-8 text-white" />
              </div>
              <h2 className="text-xl font-bold text-white">私人記帳解鎖</h2>
              <form onSubmit={(e) => {
                e.preventDefault();
                if (inputPin === pinCode) setIsLocked(false);
                else setPinError('密碼錯誤');
              }} className="space-y-4">
                <input 
                  type="password"
                  placeholder="輸入 PIN 碼"
                  value={inputPin}
                  onChange={e => setInputPin(e.target.value)}
                  className="w-full text-center text-2xl bg-slate-800 border border-slate-700 rounded-2xl py-3 text-white focus:outline-none focus:border-indigo-500"
                  autoFocus
                />
                {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold text-sm">解鎖</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
          {/* 頂部 Header */}
          <header className="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-4">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg">
                  <Icon name="credit-card" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white">信用卡與每月固定開銷管家</h1>
                  <p className="text-xs text-slate-400">專為 iPhone 防遺失設計的獨立網頁 App</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="bg-slate-800 border border-slate-700 p-1 rounded-lg flex text-xs">
                  <button onClick={() => setViewMode('billing')} className={`px-2.5 py-1 rounded-md transition ${viewMode === 'billing' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>帳單月檢視</button>
                  <button onClick={() => setViewMode('transaction')} className={`px-2.5 py-1 rounded-md transition ${viewMode === 'transaction' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>消費月檢視</button>
                </div>

                <input 
                  type="month" 
                  value={selectedMonth} 
                  onChange={(e) => setSelectedMonth(e.target.value)}
                  className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white"
                />

                <button onClick={() => setIsBackupOpen(true)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg text-cyan-400" title="備份與還原">
                  <Icon name="refresh-cw" className="w-4 h-4" />
                </button>
                <button onClick={() => setIsSettingPin(true)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg text-indigo-400" title="密碼鎖">
                  <Icon name="shield-check" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* 主要區塊 */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">
            {/* Nav Tabs */}
            <div className="flex items-center justify-between border-b border-slate-800 pb-3 overflow-x-auto gap-2">
              <div className="flex gap-2">
                {[
                  { id: 'dashboard', label: '總覽 Dashboard', icon: 'layout-dashboard' },
                  { id: 'cards', label: '信用卡與繳費狀態', icon: 'credit-card' },
                  { id: 'transactions', label: '消費與帳單明細', icon: 'dollar-sign' },
                  { id: 'installments', label: '分期付款進度', icon: 'layers' },
                  { id: 'fixed', label: '固定開銷與投資', icon: 'wallet' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                      activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4" />
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setIsAddTxOpen(true)} className="px-3.5 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold">+ 記刷卡</button>
                <button onClick={() => setIsAddFixedOpen(true)} className="px-3.5 py-1.5 bg-slate-800 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold">+ 新增固定開銷</button>
              </div>
            </div>

            {/* Tab 1: Dashboard */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4">
                    <div className="text-xs text-slate-400">當月總支出 (全包)</div>
                    <div className="text-2xl font-black text-white mt-1">${totalOutflow.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4">
                    <div className="text-xs text-slate-400">信用卡應繳總額</div>
                    <div className="text-2xl font-black text-emerald-400 mt-1">${totalCreditCardExpense.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4">
                    <div className="text-xs text-slate-400">固定開銷 / 孝親費</div>
                    <div className="text-2xl font-black text-rose-400 mt-1">${totalFixedExpenses.toLocaleString()}</div>
                  </div>
                  <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4">
                    <div className="text-xs text-slate-400">定期定額股票/ETF</div>
                    <div className="text-2xl font-black text-cyan-400 mt-1">${totalInvestments.toLocaleString()}</div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* 信用卡待繳情況 */}
                  <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-5 space-y-3">
                    <h3 className="font-bold text-white flex items-center gap-2 text-sm">
                      <Icon name="credit-card" className="w-4 h-4 text-indigo-400" /> 信用卡待繳清單 ({selectedMonth})
                    </h3>
                    {cards.map(card => {
                      const amount = cardTotals[card.id] || 0;
                      const isPaid = !!cardPayments[`${card.id}_${selectedMonth}`];
                      return (
                        <div key={card.id} className="p-3 bg-slate-800 rounded-xl flex justify-between items-center text-xs">
                          <div className="flex items-center gap-2">
                            <button onClick={() => toggleCardPayment(card.id)} className={`w-5 h-5 rounded flex items-center justify-center border ${isPaid ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600'}`}>
                              {isPaid && <Icon name="check" className="w-3 h-3" />}
                            </button>
                            <span>{card.name}</span>
                          </div>
                          <span className="font-bold">${amount.toLocaleString()} ({isPaid ? '已繳' : '未繳'})</span>
                        </div>
                      );
                    })}
                  </div>

                  {/* 固定開銷待處理 */}
                  <div className="bg-slate-800/40 border border-slate-800 rounded-2xl p-5 space-y-3">
                    <h3 className="font-bold text-white flex items-center gap-2 text-sm">
                      <Icon name="wallet" className="w-4 h-4 text-purple-400" /> 固定開銷與投資 ({selectedMonth})
                    </h3>
                    {fixedItems.map(item => {
                      const isPaid = !!fixedPayments[`${item.id}_${selectedMonth}`];
                      return (
                        <div key={item.id} className="p-3 bg-slate-800 rounded-xl flex justify-between items-center text-xs">
                          <div className="flex items-center gap-2">
                            <button onClick={() => toggleFixedPayment(item.id)} className={`w-5 h-5 rounded flex items-center justify-center border ${isPaid ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-600'}`}>
                              {isPaid && <Icon name="check" className="w-3 h-3" />}
                            </button>
                            <span>{item.title}</span>
                          </div>
                          <span className="font-bold">${item.amount.toLocaleString()}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* Tab 2: Cards */}
            {activeTab === 'cards' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {cards.map(card => {
                  const amount = cardTotals[card.id] || 0;
                  const isPaid = !!cardPayments[`${card.id}_${selectedMonth}`];
                  return (
                    <div key={card.id} className={`p-6 rounded-3xl bg-gradient-to-br ${card.color} text-white space-y-4 shadow-xl`}>
                      <div className="flex justify-between items-start">
                        <h3 className="text-lg font-bold">{card.name}</h3>
                        <span className="text-xs px-2 py-1 bg-white/20 rounded-full">{isPaid ? '已繳' : '未繳'}</span>
                      </div>
                      <div>
                        <div className="text-xs opacity-80">當期帳單金額</div>
                        <div className="text-3xl font-black">${amount.toLocaleString()}</div>
                      </div>
                      <div className="text-xs opacity-80 flex justify-between border-t border-white/10 pt-2">
                        <span>每月 {card.closingDay} 日結帳</span>
                        <span>每月 {card.dueDay} 日繳款</span>
                      </div>
                      <button onClick={() => toggleCardPayment(card.id)} className="w-full py-2 bg-black/20 hover:bg-black/30 text-xs rounded-xl font-bold">
                        {isPaid ? '標示為未繳' : '標示為已繳費'}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Tab 3: Transactions */}
            {activeTab === 'transactions' && (
              <div className="bg-slate-800/40 border border-slate-800 rounded-2xl overflow-hidden">
                <table className="w-full text-left text-xs text-slate-200">
                  <thead className="bg-slate-800 text-slate-400 border-b border-slate-700">
                    <tr>
                      <th className="p-3">消費日</th>
                      <th className="p-3">歸屬帳單</th>
                      <th className="p-3">項目</th>
                      <th className="p-3">卡片</th>
                      <th className="p-3 text-right">金額</th>
                      <th className="p-3 text-center">刪除</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {currentMonthTransactions.map(t => (
                      <tr key={t.id} className="hover:bg-slate-800/50">
                        <td className="p-3 font-mono">{t.txDate}</td>
                        <td className="p-3 font-mono text-indigo-300">
                          <input 
                            type="month" 
                            value={t.billingCycle} 
                            onChange={(e) => {
                              const val = e.target.value;
                              setTransactions(transactions.map(item => item.id === t.id ? { ...item, billingCycle: val } : item));
                            }}
                            className="bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 text-xs text-indigo-300"
                          />
                        </td>
                        <td className="p-3 font-medium">{t.title}</td>
                        <td className="p-3">{cards.find(c => c.id === t.cardId)?.name}</td>
                        <td className="p-3 text-right font-bold">${t.amount.toLocaleString()}</td>
                        <td className="p-3 text-center">
                          <button onClick={() => setTransactions(transactions.filter(item => item.id !== t.id))} className="text-rose-400">刪除</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* Tab 4: Installments */}
            {activeTab === 'installments' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {installmentGroups.map(group => {
                  const paidTermsCount = group.terms.filter(t => t.billingCycle <= selectedMonth).length;
                  const progressPct = Math.min(100, Math.round((paidTermsCount / group.totalTerms) * 100));

                  return (
                    <div key={group.groupId} className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-4">
                      <div className="flex justify-between items-start">
                        <h3 className="text-base font-bold text-white">{group.title}</h3>
                        <button onClick={() => setTransactions(transactions.filter(t => t.groupId !== group.groupId))} className="text-xs text-rose-400">刪除整筆分期</button>
                      </div>

                      <div className="space-y-1">
                        <div className="flex justify-between text-xs text-slate-300">
                          <span>分期進度: {paidTermsCount} / {group.totalTerms} 期</span>
                          <span className="font-bold">{progressPct}%</span>
                        </div>
                        <div className="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
                          <div className="bg-gradient-to-r from-purple-500 to-indigo-500 h-2 rounded-full" style={{ width: `${progressPct}%` }}></div>
                        </div>
                      </div>

                      <div className="text-xs space-y-1 pt-2 border-t border-slate-700">
                        {group.terms.map(term => (
                          <div key={term.id} className="flex justify-between">
                            <span>{term.billingCycle} 帳單 (第 {term.installmentInfo?.currentTerm} 期)</span>
                            <span className="font-bold">${term.amount.toLocaleString()}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Tab 5: Fixed Expenses */}
            {activeTab === 'fixed' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {fixedItems.map(item => (
                  <div key={item.id} className="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-3">
                    <div className="flex justify-between items-start">
                      <span className="text-xs px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">{item.category}</span>
                      <button onClick={() => setFixedItems(fixedItems.filter(f => f.id !== item.id))} className="text-rose-400 text-xs">刪除</button>
                    </div>
                    <h3 className="text-base font-bold text-white">{item.title}</h3>
                    <div className="text-2xl font-extrabold text-white">${item.amount.toLocaleString()}</div>
                    <div className="text-xs text-slate-400">扣款日: 每月 {item.payDay} 日</div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal: 新增刷卡 */}
          {isAddTxOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-bold text-white">記一筆刷卡消費</h3>
                <form onSubmit={handleAddTransaction} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1">消費項目</label>
                    <input type="text" required placeholder="如：全家超商" value={newTx.title} onChange={e => setNewTx({ ...newTx, title: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-400 mb-1">金額</label>
                      <input type="number" required placeholder="0" value={newTx.amount} onChange={e => setNewTx({ ...newTx, amount: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">信用卡</label>
                      <select value={newTx.cardId} onChange={e => setNewTx({ ...newTx, cardId: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white">
                        {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="p-3 bg-slate-900 rounded-xl space-y-2">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={newTx.isInstallment} onChange={e => setNewTx({ ...newTx, isInstallment: e.target.checked })} />
                      <span>開啟信用卡分期付款</span>
                    </label>
                    {newTx.isInstallment && (
                      <select value={newTx.totalTerms} onChange={e => setNewTx({ ...newTx, totalTerms: Number(e.target.value) })} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-white">
                        {[3, 6, 12, 18, 24].map(n => <option key={n} value={n}>分 {n} 期</option>)}
                      </select>
                    )}
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">儲存明細</button>
                    <button type="button" onClick={() => setIsAddTxOpen(false)} className="px-4 py-2.5 bg-slate-700 text-slate-300 rounded-xl">取消</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Backup Modal */}
          {isBackupOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
                <h3 className="text-lg font-bold text-white">iPhone 備份與還原</h3>
                <p className="text-xs text-slate-400">為防止 iPhone 清除瀏覽器快取，建議定期導出備份檔儲存至「檔案」App。</p>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      const data = { cards, transactions, fixedItems, cardPayments, fixedPayments };
                      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                      const a = document.createElement('a');
                      a.href = URL.createObjectURL(blob);
                      a.download = `finance_backup_${new Date().toISOString().split('T')[0]}.json`;
                      a.click();
                    }}
                    className="flex-1 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold"
                  >
                    匯出備份檔
                  </button>
                  <label className="flex-1 py-2 bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold text-center cursor-pointer">
                    還原備份檔
                    <input 
                      type="file" 
                      accept=".json"
                      className="hidden"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (event) => {
                          try {
                            const data = JSON.parse(event.target.result);
                            if (data.cards) setCards(data.cards);
                            if (data.transactions) setTransactions(data.transactions);
                            if (data.fixedItems) setFixedItems(data.fixedItems);
                            alert('備份已成功還原！');
                            setIsBackupOpen(false);
                          } catch (err) { alert('格式錯誤'); }
                        };
                        reader.readAsText(file);
                      }}
                    />
                  </label>
                </div>
                <button onClick={() => setIsBackupOpen(false)} className="w-full py-2 bg-slate-900 text-slate-400 rounded-xl text-xs">關閉</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
